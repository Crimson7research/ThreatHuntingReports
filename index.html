<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat Hunting Reports | CRIMSON7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #06090f;
            --bg-secondary: #0c1017;
            --bg-tertiary: #111820;
            --bg-card: #0e1219;
            --bg-card-hover: #131922;
            --bg-surface: #151c26;
            --border-color: #1e2736;
            --border-subtle: #171e29;
            --border-hover: #2a3648;
            --text-primary: #e8edf4;
            --text-secondary: #7d8a9a;
            --text-muted: #4a5568;
            --accent-red: #ff4d4d;
            --accent-red-dim: #e63946;
            --accent-orange: #f59e0b;
            --accent-yellow: #eab308;
            --accent-blue: #3b82f6;
            --accent-blue-bright: #60a5fa;
            --accent-green: #22c55e;
            --accent-purple: #a78bfa;
            --accent-cyan: #22d3ee;
            --accent-pink: #f472b6;
            --crimson: #dc2626;
            --crimson-glow: rgba(220,38,38,0.15);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 14px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Hero ─────────────────────────────────────── */
        .hero {
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .hero-gradient-bar {
            height: 2px;
            background: linear-gradient(90deg, var(--crimson) 0%, #ff6b35 25%, var(--accent-orange) 50%, var(--accent-blue) 75%, var(--accent-purple) 100%);
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .hero-bg::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            top: -200px; left: -100px;
            background: radial-gradient(circle, rgba(220,38,38,0.07) 0%, transparent 70%);
        }

        .hero-bg::after {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            bottom: -250px; right: -50px;
            background: radial-gradient(circle, rgba(59,130,246,0.05) 0%, transparent 70%);
        }

        /* Animated grid pattern */
        .hero-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 70%);
            pointer-events: none;
        }

        .hero-inner {
            max-width: 1320px;
            margin: 0 auto;
            padding: 3rem 2.5rem 2.75rem;
            display: flex;
            align-items: center;
            gap: 2.5rem;
            position: relative;
            z-index: 1;
        }

        .logo { flex-shrink: 0; }
        .logo img {
            width: 170px;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(220,38,38,0.2));
            transition: filter 0.3s;
        }
        .logo img:hover { filter: drop-shadow(0 0 40px rgba(220,38,38,0.35)); }

        .hero-text { flex: 1; }

        .hero-text h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.75px;
            line-height: 1.15;
            color: var(--text-primary);
        }

        .hero-text h1 .accent {
            background: linear-gradient(135deg, var(--accent-red) 0%, var(--accent-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.6rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .hero-subtitle .divider {
            width: 1px;
            height: 14px;
            background: var(--border-hover);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.2rem 0.6rem;
            background: rgba(220,38,38,0.08);
            border: 1px solid rgba(220,38,38,0.2);
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent-red);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hero-badge .pulse {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-red);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,77,77,0.4); }
            50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(255,77,77,0); }
        }

        /* ── Main ─────────────────────────────────────── */
        .main {
            max-width: 1320px;
            margin: 0 auto;
            padding: 2rem 2.5rem 5rem;
        }

        /* ── Stats row ────────────────────────────────── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 1rem 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        .stat-icon {
            width: 42px; height: 42px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .stat-icon.red    { background: rgba(255,77,77,0.08);  color: var(--accent-red); }
        .stat-icon.blue   { background: rgba(59,130,246,0.08); color: var(--accent-blue); }
        .stat-icon.purple { background: rgba(167,139,250,0.08);color: var(--accent-purple); }
        .stat-icon.green  { background: rgba(34,197,94,0.08);  color: var(--accent-green); }

        .stat-info { display: flex; flex-direction: column; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); line-height: 1.1; font-variant-numeric: tabular-nums; }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; margin-top: 0.15rem; }

        /* ── Toolbar ──────────────────────────────────── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
            flex-wrap: wrap;
            padding-bottom: 1.75rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 340px;
        }

        .search-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }

        .search-input {
            width: 100%;
            padding: 0.6rem 0.85rem 0.6rem 2.4rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
            background: var(--bg-surface);
        }

        .search-input:focus ~ .search-icon { color: var(--accent-blue); }
        .search-input::placeholder { color: var(--text-muted); }

        .filter-group {
            display: flex;
            gap: 0;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .filter-btn {
            padding: 0.5rem 0.9rem;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-right: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .filter-btn:last-child { border-right: none; }
        .filter-btn:hover { color: var(--text-secondary); background: rgba(255,255,255,0.02); }
        .filter-btn.active { color: var(--accent-blue-bright); background: rgba(59,130,246,0.08); }
        .filter-btn.active[data-filter="critical"] { color: var(--accent-red); background: rgba(255,77,77,0.08); }
        .filter-btn.active[data-filter="high"]     { color: var(--accent-orange); background: rgba(245,158,11,0.08); }
        .filter-btn.active[data-filter="medium"]   { color: var(--accent-yellow); background: rgba(234,179,8,0.08); }

        .sort-select {
            padding: 0.5rem 0.75rem;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: 500;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: border-color 0.2s;
            margin-left: auto;
        }

        .sort-select:focus { outline: none; border-color: var(--accent-blue); }
        .sort-select option { background: var(--bg-tertiary); color: var(--text-primary); }

        .results-count {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }

        .results-count strong { color: var(--text-secondary); font-weight: 600; }

        /* ── Report Grid ──────────────────────────────── */
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1rem;
        }

        .report-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0px;
            padding: 1.5rem 1.6rem;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        /* Severity accent line on left */
        .report-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 1px;
            border-radius: 0;
            transition: all 0.2s;
        }

        .report-card.sev-critical::before { background: var(--accent-red); }
        .report-card.sev-high::before     { background: var(--accent-orange); }
        .report-card.sev-medium::before   { background: var(--accent-yellow); }
        .report-card.sev-low::before      { background: var(--accent-green); }

        /* Subtle severity glow on hover */
        .report-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 120px; height: 100%;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .report-card.sev-critical::after { background: linear-gradient(90deg, rgba(255,77,77,0.04), transparent); }
        .report-card.sev-high::after     { background: linear-gradient(90deg, rgba(245,158,11,0.04), transparent); }
        .report-card.sev-medium::after   { background: linear-gradient(90deg, rgba(234,179,8,0.03), transparent); }
        .report-card.sev-low::after      { background: linear-gradient(90deg, rgba(34,197,94,0.03), transparent); }

        .report-card:hover {
            transform: translateY(-2px);
            border-color: rgba(180,40,40,0.35);
            box-shadow: 0 16px 40px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.2);
            background: #120a0a;
        }

        .report-card:hover::before { width: 2px; }
        .report-card:hover::after  { opacity: 1; }

        .report-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.85rem;
            gap: 0.5rem;
        }

        .report-severity {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.7rem;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-family: 'JetBrains Mono', monospace;
        }

        .severity-critical { background: rgba(255,77,77,0.1);  color: var(--accent-red);    border: 1px solid rgba(255,77,77,0.2); }
        .severity-high     { background: rgba(245,158,11,0.1); color: var(--accent-orange); border: 1px solid rgba(245,158,11,0.2); }
        .severity-medium   { background: rgba(234,179,8,0.1);  color: var(--accent-yellow); border: 1px solid rgba(234,179,8,0.2); }
        .severity-low      { background: rgba(34,197,94,0.1);  color: var(--accent-green);  border: 1px solid rgba(34,197,94,0.2); }

        .report-type {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent-purple);
            background: rgba(167,139,250,0.08);
            border: 1px solid rgba(167,139,250,0.15);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            white-space: nowrap;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.2px;
        }

        .report-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
            line-height: 1.35;
            letter-spacing: -0.2px;
        }

        .report-card:hover .report-title { color: #fff; }

        .report-description {
            color: var(--text-secondary);
            font-size: 0.84rem;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
            line-height: 1.55;
        }

        .report-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 1rem;
        }

        .tag {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            background: rgba(34,211,238,0.05);
            border: 1px solid rgba(34,211,238,0.12);
            border-radius: 5px;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .report-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0.85rem;
            border-top: 1px solid var(--border-subtle);
        }

        .report-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .report-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .report-arrow {
            color: var(--text-muted);
            transition: all 0.2s;
            opacity: 0;
            transform: translateX(-4px);
        }

        .report-card:hover .report-arrow {
            opacity: 1;
            transform: translateX(0);
            color: var(--accent-blue-bright);
        }

        /* ── States ───────────────────────────────────── */
        .loading {
            text-align: center;
            padding: 6rem 2rem;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 32px; height: 32px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 6rem 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            grid-column: 1 / -1;
        }

        .empty-state svg {
            width: 44px; height: 44px;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            opacity: 0.35;
        }

        /* ── Card entrance ────────────────────────────── */
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .report-card { animation: cardIn 0.3s ease both; }

        /* ── Footer ───────────────────────────────────── */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 2rem 2.5rem;
        }

        .footer-inner {
            max-width: 1320px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .footer-logo {
            width: 28px;
            height: 28px;
            background: var(--crimson-glow);
            border: 1px solid rgba(220,38,38,0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-red-dim);
            font-weight: 800;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .footer-text { color: var(--text-muted); font-size: 0.8rem; }

        .footer-links { display: flex; gap: 1.5rem; }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: color 0.15s;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .footer-links a:hover { color: var(--text-secondary); }

        /* ── Scrollbar ────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* ── Responsive ───────────────────────────────── */
        @media (max-width: 900px) {
            .reports-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .hero-inner { flex-direction: column; text-align: center; padding: 2rem 1.25rem 1.75rem; gap: 1.5rem; }
            .hero-text h1 { font-size: 1.65rem; }
            .hero-subtitle { justify-content: center; flex-wrap: wrap; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .toolbar { flex-direction: column; align-items: stretch; }
            .search-wrapper { max-width: 100%; }
            .filter-group { justify-content: center; }
            .sort-select { margin-left: 0; width: 100%; }
            .results-count { text-align: center; width: 100%; }
            .reports-grid { grid-template-columns: 1fr; }
            .main { padding: 1.5rem 1rem 3rem; }
            .footer { padding: 1.5rem 1.25rem; }
            .footer-inner { justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Hero -->
    <header class="hero">
        <div class="hero-gradient-bar"></div>
        <div class="hero-bg"></div>
        <div class="hero-grid"></div>
        <div class="hero-inner">
            <div class="logo">
                <img src="https://cdn.prod.website-files.com/67711bb097dfc839a8004a6c/68482a560217871b92242435_c7_logo_small.png" alt="CRIMSON7 Logo">
            </div>
            <div class="hero-text">
                <div class="hero-badge"><span class="pulse"></span> Community Edition</div>
                <h1>Threat <span class="accent">Hunting</span> Reports</h1>
                <div class="hero-subtitle">
                    <span>Microsoft Sentinel Detection Runbooks</span>
                    <span class="divider"></span>
                    <span>KQL Queries</span>
                    <span class="divider"></span>
                    <span>MITRE ATT&amp;CK Mapped</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon red">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="total-reports">&mdash;</div>
                    <div class="stat-label">Reports</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="total-queries">&mdash;</div>
                    <div class="stat-label">KQL Queries</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="total-techniques">&mdash;</div>
                    <div class="stat-label">MITRE Techniques</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-value" id="last-updated">&mdash;</div>
                    <div class="stat-label">Last Updated</div>
                </div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-wrapper">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="search-input" placeholder="Search reports, tags..." id="search-input">
            </div>
            <div class="filter-group" id="severity-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="critical">Critical</button>
                <button class="filter-btn" data-filter="high">High</button>
                <button class="filter-btn" data-filter="medium">Medium</button>
            </div>
            <select class="sort-select" id="sort-select">
                <option value="date-desc">Newest first</option>
                <option value="date-asc">Oldest first</option>
                <option value="severity">By severity</option>
                <option value="title">A &ndash; Z</option>
            </select>
            <span class="results-count" id="results-count"></span>
        </div>

        <!-- Grid -->
        <div class="reports-grid" id="reports-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading reports&hellip;</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-left">
                <div class="footer-logo">C7</div>
                <span class="footer-text">&copy; 2025 CRIMSON7 &mdash; Threat Hunting Reports for Microsoft Sentinel</span>
            </div>
            <div class="footer-links">
                <a href="https://crimson7.io" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                    crimson7.io
                </a>
                <a href="https://github.com/Crimson7research/ThreatHuntingReports" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    GitHub
                </a>
            </div>
        </div>
    </footer>

    <script>
        const icons = {
            calendar: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
            code:     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
            version:  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
            arrow:    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
            dot:      '<svg width="6" height="6" viewBox="0 0 6 6"><circle cx="3" cy="3" r="3" fill="currentColor"/></svg>'
        };

        const sevOrder = { critical: 0, high: 1, medium: 2, low: 3 };
        let reportsData = [];
        let activeFilter = 'all';

        function createReportCard(report, index) {
            const tagsHtml = report.tags.slice(0, 5).map(t => `<span class="tag">${t}</span>`).join('') +
                (report.tags.length > 5 ? `<span class="tag">+${report.tags.length - 5}</span>` : '');
            const delay = Math.min(index * 0.035, 0.35);

            return `
                <a href="${report.file}" class="report-card sev-${report.severity}"
                   data-title="${report.title.toLowerCase()}"
                   data-tags="${report.tags.join(' ').toLowerCase()}"
                   data-severity="${report.severity}"
                   data-description="${(report.description || '').toLowerCase()}"
                   style="animation-delay:${delay}s">
                    <div class="report-card-header">
                        <span class="report-severity severity-${report.severity}">${icons.dot} ${report.severity}</span>
                        <span class="report-type">${report.type}</span>
                    </div>
                    <h2 class="report-title">${report.title}</h2>
                    <p class="report-description">${report.description}</p>
                    <div class="report-tags">${tagsHtml}</div>
                    <div class="report-footer">
                        <div class="report-meta">
                            <span>${icons.calendar} ${report.date}</span>
                            <span>${icons.code} ${report.queries} queries</span>
                            <span>${icons.version} v${report.version}</span>
                        </div>
                        <span class="report-arrow">${icons.arrow}</span>
                    </div>
                </a>`;
        }

        function sortReports(data, mode) {
            const sorted = [...data];
            switch (mode) {
                case 'date-asc':  sorted.sort((a, b) => new Date(a.date) - new Date(b.date)); break;
                case 'severity':  sorted.sort((a, b) => (sevOrder[a.severity] ?? 9) - (sevOrder[b.severity] ?? 9)); break;
                case 'title':     sorted.sort((a, b) => a.title.localeCompare(b.title)); break;
                default:          sorted.sort((a, b) => new Date(b.date) - new Date(a.date));
            }
            return sorted;
        }

        function renderReports() {
            const grid = document.getElementById('reports-grid');
            const query = document.getElementById('search-input').value.toLowerCase();
            const sortMode = document.getElementById('sort-select').value;

            let filtered = reportsData.filter(r => {
                if (activeFilter !== 'all' && r.severity !== activeFilter) return false;
                if (query) {
                    const haystack = (r.title + ' ' + r.tags.join(' ') + ' ' + (r.description || '') + ' ' + (r.type || '')).toLowerCase();
                    return haystack.includes(query);
                }
                return true;
            });

            filtered = sortReports(filtered, sortMode);

            // Results count
            const countEl = document.getElementById('results-count');
            if (query || activeFilter !== 'all') {
                countEl.innerHTML = `Showing <strong>${filtered.length}</strong> of <strong>${reportsData.length}</strong>`;
            } else {
                countEl.innerHTML = '';
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <p>No reports match your criteria.</p></div>`;
                return;
            }

            grid.innerHTML = filtered.map(createReportCard).join('');
        }

        function updateStats() {
            const all = reportsData;
            document.getElementById('total-reports').textContent = all.length;
            document.getElementById('total-queries').textContent = all.reduce((s, r) => s + (r.queries || 0), 0);

            const mitre = new Set();
            all.forEach(r => r.tags.forEach(t => { if (/^T\d{4}/i.test(t)) mitre.add(t.toUpperCase()); }));
            document.getElementById('total-techniques').textContent = mitre.size || '\u2014';

            // Last updated - most recent report date
            if (all.length) {
                const dates = all.map(r => new Date(r.date)).filter(d => !isNaN(d));
                if (dates.length) {
                    const latest = new Date(Math.max(...dates));
                    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                    document.getElementById('last-updated').textContent = months[latest.getMonth()] + ' ' + latest.getDate();
                }
            }
        }

        function loadReports() {
            fetch('reports.json')
                .then(r => r.json())
                .then(data => {
                    reportsData = data;
                    updateStats();
                    renderReports();
                })
                .catch(() => {
                    document.getElementById('reports-grid').innerHTML =
                        '<div class="empty-state"><p>Failed to load reports.</p></div>';
                });
        }

        // Events
        document.getElementById('search-input').addEventListener('input', renderReports);
        document.getElementById('sort-select').addEventListener('change', renderReports);

        document.getElementById('severity-filters').addEventListener('click', e => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeFilter = btn.dataset.filter;
            renderReports();
        });

        // Keyboard shortcut: / to focus search
        document.addEventListener('keydown', e => {
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                document.getElementById('search-input').focus();
            }
        });

        loadReports();
    </script>
</body>
</html>
