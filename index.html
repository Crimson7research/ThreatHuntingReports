<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat Hunting Reports | CRIMSON7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --bg-code: #1a1f27;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-red: #f85149;
            --accent-red-bg: rgba(248, 81, 73, 0.15);
            --accent-orange: #d29922;
            --accent-orange-bg: rgba(210, 153, 34, 0.15);
            --accent-yellow: #e3b341;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-purple: #a371f7;
            --accent-cyan: #39c5cf;
            --crimson: #c62828;
            --crimson-light: #ef5350;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 15px;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 3rem 2rem;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--crimson) 0%, var(--crimson-light) 50%, var(--accent-orange) 100%);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo img {
            width: 200px;
            height: auto;
        }

        .header-text h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header-text p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .stats-bar {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.red { background: var(--accent-red-bg); color: var(--accent-red); }
        .stat-icon.blue { background: rgba(88, 166, 255, 0.15); color: var(--accent-blue); }
        .stat-icon.green { background: rgba(63, 185, 80, 0.15); color: var(--accent-green); }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .search-container {
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 400px;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .report-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: block;
        }

        .report-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-blue);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .report-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .report-severity {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .severity-critical {
            background: var(--accent-red-bg);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .severity-high {
            background: var(--accent-orange-bg);
            color: var(--accent-orange);
            border: 1px solid var(--accent-orange);
        }

        .severity-medium {
            background: rgba(227, 179, 65, 0.15);
            color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow);
        }

        .severity-low {
            background: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .report-type {
            font-size: 0.75rem;
            color: var(--accent-purple);
            background: rgba(163, 113, 247, 0.15);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .report-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .report-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .report-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .report-meta span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .report-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            background: var(--bg-tertiary);
            border-radius: 4px;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 2rem;
            margin-top: 3rem;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent-blue);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .header-text h1 {
                font-size: 1.75rem;
            }

            .stats-bar {
                justify-content: center;
            }

            .reports-grid {
                grid-template-columns: 1fr;
            }

            .main {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="https://cdn.prod.website-files.com/67711bb097dfc839a8004a6c/68482a560217871b92242435_c7_logo_small.png" alt="CRIMSON7 Logo">
            </div>
            <div class="header-text">
                <h1>Threat Hunting Reports</h1>
                <p>Microsoft Sentinel Detection Runbooks & KQL Queries</p>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-icon red">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>
                </div>
                <div>
                    <div class="stat-value" id="total-reports">-</div>
                    <div class="stat-label">Total Reports</div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon blue">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                </div>
                <div>
                    <div class="stat-value" id="total-queries">-</div>
                    <div class="stat-label">KQL Queries</div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon green">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </div>
                <div>
                    <div class="stat-value">Active</div>
                    <div class="stat-label">Defense Status</div>
                </div>
            </div>
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" class="search-input" placeholder="Search reports..." id="search-input">
            </div>
        </div>

        <div class="reports-grid" id="reports-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading reports...</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-text">
                &copy; 2025 CRIMSON7. Threat Hunting Reports for Microsoft Sentinel.
            </div>
        </div>
    </footer>

    <script>
        const icons = {
            calendar: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm-8 4H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>',
            code: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>',
            version: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>'
        };

        let reportsData = [
            {
                "file": "shai-hulud-threat-hunt-runbook.html",
                "title": "Shai-Hulud NPM Supply Chain Attack",
                "description": "Sophisticated NPM supply chain attack compromising 796+ packages with credential theft and destructive payload capabilities.",
                "severity": "critical",
                "type": "Supply Chain",
                "tags": ["npm", "supply-chain", "credential-theft", "trufflehog"],
                "date": "Dec 2, 2025",
                "queries": 14,
                "version": "2.0"
            },
            {
                "file": "notepad-chrysalis-threat-hunt-runbook.html",
                "title": "Notepad++ Hijacking Attack",
                "description": "Chinese APT (Lotus Blossom) compromised Notepad++ update infrastructure to deliver Chrysalis backdoor via DLL sideloading.",
                "severity": "critical",
                "type": "Supply Chain",
                "tags": ["notepad++", "apt", "dll-sideloading", "chrysalis", "cobalt-strike"],
                "date": "Feb 3, 2026",
                "queries": 6,
                "version": "1.0"
            }
        ];

        function createReportCard(report) {
            const tagsHtml = report.tags.map(tag => `<span class="tag">${tag}</span>`).join('');

            return `
                <a href="${report.file}" class="report-card" data-title="${report.title.toLowerCase()}" data-tags="${report.tags.join(' ').toLowerCase()}">
                    <div class="report-card-header">
                        <span class="report-severity severity-${report.severity}">${report.severity}</span>
                        <span class="report-type">${report.type}</span>
                    </div>
                    <h2 class="report-title">${report.title}</h2>
                    <p class="report-description">${report.description}</p>
                    <div class="report-tags">${tagsHtml}</div>
                    <div class="report-meta">
                        <span>${icons.calendar} ${report.date}</span>
                        <span>${icons.code} ${report.queries} queries</span>
                        <span>${icons.version} v${report.version}</span>
                    </div>
                </a>
            `;
        }

        function loadReports() {
            const grid = document.getElementById('reports-grid');
            grid.innerHTML = reportsData.map(createReportCard).join('');

            document.getElementById('total-reports').textContent = reportsData.length;
            const totalQueries = reportsData.reduce((sum, r) => sum + (r.queries || 0), 0);
            document.getElementById('total-queries').textContent = totalQueries;
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.report-card');

            cards.forEach(card => {
                const title = card.dataset.title || '';
                const tags = card.dataset.tags || '';
                const visible = title.includes(query) || tags.includes(query);
                card.style.display = visible ? 'block' : 'none';
            });
        });

        // Initialize
        loadReports();
    </script>
</body>
</html>
